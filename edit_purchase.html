{% extends 'base.html' %}{% block content %}<section class='card'><h1>Depo alımını düzenle</h1><p>Değişiklik kaydedilmeden stok ve zorunlu alanlar kontrol edilir.</p><form method='post' class='formgrid'><label>season<select name="season">{% for v in seasons %}<option value="{{v}}" {% if record.season==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>purchase_date<input name="purchase_date" type="date" value="{{record.purchase_date or ''}}" required ></label><label>category<select name="category">{% for v in categories %}<option value="{{v}}" {% if record.category==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>item<input name="item" type="text" value="{{record.item or ''}}" required ></label><label>Çeşit / ayrıntı<input name="item_detail" value="{{record.item_detail or ''}}" maxlength="120"></label><label>quantity<input name="quantity" type="number" value="{{record.quantity or ''}}" required step="0.001" min="0.001"></label><label>unit<select name="unit"><option value="{{v}}" {% if record.unit==v %}selected{% endif %}>{{v}}</option>{% for v in units %}<option value="{{v}}" {% if record.unit==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>unit_price<input name="unit_price" type="number" value="{{record.unit_price or ''}}" required step="0.01" min="0"></label><label>supplier_note<input name="supplier_note" type="text" value="{{record.supplier_note or ''}}"  ></label><div class='formactions'><button type='submit'>Değişiklikleri kaydet</button> <a href='/depo'>Vazgeç</a></div></form></section>{% endblock %}
