{% extends 'base.html' %}{% block content %}<section class="card"><h1>Destek kaydını düzenle</h1><p class="muted">Kayıt numarası: {{record.id if record.id is defined else record.code}}</p><form method="post" class="formgrid"><label>Ödeme tarihi<input type="date" name="payment_date" value="{{record.payment_date or ''}}" required ></label><label>Sezon<select name="season">{% for s in seasons %}<option value="{{s}}" {% if record.season==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label><label>Destek türü<input type="text" name="support_type" value="{{record.support_type or ''}}" required ></label><label>Açıklama<input type="text" name="description" value="{{record.description or ''}}" required ></label><label>Ürün<select name="crop"><option value="" {% if record.crop == '' %}selected{% endif %}></option><option value="Buğday" {% if record.crop == 'Buğday' %}selected{% endif %}>Buğday</option><option value="Arpa" {% if record.crop == 'Arpa' %}selected{% endif %}>Arpa</option><option value="Nohut" {% if record.crop == 'Nohut' %}selected{% endif %}>Nohut</option><option value="Ayçiçeği" {% if record.crop == 'Ayçiçeği' %}selected{% endif %}>Ayçiçeği</option><option value="Diğer" {% if record.crop == 'Diğer' %}selected{% endif %}>Diğer</option></select></label><label>Tutar<input type="number" name="amount" value="{{record.amount or ''}}" required step="0.01" min="0"></label><div class="formactions"><button type="submit">Değişiklikleri kaydet</button><a href="{{url_for('supports_page')}}">Vazgeç</a></div></form></section>{% endblock %}
