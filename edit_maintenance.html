{% extends 'base.html' %}{% block content %}<section class="card"><h1>Makine bakım kaydını düzenle</h1><p class="muted">Kayıt numarası: {{record.id if record.id is defined else record.code}}</p><form method="post" class="formgrid"><label>Sezon<select name="season">{% for s in seasons %}<option value="{{s}}" {% if record.season==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></label><label>Tarih<input type="date" name="service_date" value="{{record.service_date or ''}}" required ></label><label>Makine<input type="text" name="machine" value="{{record.machine or ''}}" required ></label><label>Çalışma saati<input type="number" name="work_hours" value="{{record.work_hours or ''}}"  step="0.01" min="0"></label><label>Açıklama<input type="text" name="description" value="{{record.description or ''}}" required ></label><label>Tutar<input type="number" name="cost" value="{{record.cost or ''}}" required step="0.01" min="0"></label><label>Not<input type="text" name="note" value="{{record.note or ''}}"  ></label><div class="formactions"><button type="submit">Değişiklikleri kaydet</button><a href="{{url_for('maintenance_page')}}">Vazgeç</a></div></form></section>{% endblock %}
